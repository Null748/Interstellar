
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Audio Visualizer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03020a;color:#fff;font-family:Montserrat,sans-serif}
#visualizer{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.48) 100%)}
.intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#03020a;transition:opacity 1.2s}
.intro h1{font-size:clamp(32px,7vw,76px);font-weight:200;letter-spacing:.42em;padding-left:.42em;opacity:0;animation:reveal 2.5s ease forwards}
.intro p{margin-top:22px;color:#b8a6e8;font-size:10px;letter-spacing:.45em;opacity:0;animation:reveal 2s ease .7s forwards}
.start{margin-top:55px;padding:15px 32px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font:10px Montserrat,sans-serif;letter-spacing:.3em;cursor:pointer;opacity:0;animation:reveal 2s ease 1.4s forwards}
.start:hover{background:#fff;color:#080510}
@keyframes reveal{to{opacity:1}}
.hud{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .8s}
.hud.visible{opacity:1}
.logo{position:absolute;top:34px;left:40px;font-size:11px;letter-spacing:.4em}
.phase{position:absolute;top:37px;right:40px;font-size:9px;letter-spacing:.25em;color:#d8caff}
.track{position:absolute;left:40px;bottom:40px}
.track-name{font-size:11px;letter-spacing:.25em;margin-bottom:8px}
.track-sub{font-size:9px;letter-spacing:.2em;color:#aaa0cb}
.controls{position:absolute;right:40px;bottom:35px;display:flex;gap:18px;pointer-events:auto}
.controls button{border:0;background:transparent;color:white;font-size:20px;cursor:pointer}
.controls button:hover{color:#ff8cff}
.time{position:absolute;right:40px;bottom:70px;color:#c4b6e8;font-size:9px;letter-spacing:.15em}
.progress{position:absolute;bottom:0;left:0;width:100%;height:2px;background:rgba(255,255,255,.15)}
.progress-fill{height:100%;width:0;background:#fff}
@media(max-width:600px){.logo{left:18px;top:20px}.phase{right:18px;top:23px}.track{left:18px;bottom:62px}.controls{right:18px;bottom:20px}.time{right:18px;bottom:53px}}
</style>
</head>
<body>
<canvas id="visualizer"></canvas><div class="vignette"></div>
<div class="intro" id="intro">
  <h1>INTERSTELLAR</h1><p>A MUSICAL VISUAL EXPERIENCE</p>
  <button class="start" id="startButton">ENTER THE EXPERIENCE</button>
</div>
<div class="hud" id="hud">
  <div class="logo">INTERSTELLAR</div><div class="phase" id="phase">LIVE AUDIO REACTIVE</div>
  <div class="track"><div class="track-name">MAIN THEME</div><div class="track-sub">HANS ZIMMER</div></div>
  <div class="time" id="time">00:00</div>
  <div class="controls">
    <button id="pauseButton" title="Pause / Play">Ⅱ</button>
    <button id="restartButton" title="Restart">↺</button>
    <button id="muteButton" title="Mute">♪</button>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
</div>
<audio id="music" preload="auto">
  <source src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3" type="audio/mpeg">
</audio>
<script>
const canvas=document.getElementById('visualizer');
const ctx=canvas.getContext('2d',{alpha:false});
const music=document.getElementById('music');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
let W=0,H=0,cx=0,cy=0,scale=1;
let audioContext,analyser,source,freqData,timeData;
let started=false,paused=false,muted=false,raf=0,lastFrame=0,lastAudioTime=0;
let energy=0,bass=0,mid=0,treble=0,beatPulse=0,notePulse=0;
let bassHistory=[],fluxHistory=[],previousSpectrum=null;
let particles=[];
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function resize(){
  W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;
  scale=Math.min(devicePixelRatio||1,1)*.72;
  canvas.width=Math.max(1,Math.floor(W*scale));canvas.height=Math.max(1,Math.floor(H*scale));
  ctx.setTransform(scale,0,0,scale,0,0);
  makeParticles();
}
function makeParticles(){
  particles=Array.from({length:105},()=>({
    angle:Math.random()*TAU,r:Math.random()*Math.min(W,H)*.48+25,
    speed:(Math.random()*.002+.0005)*(Math.random()<.5?-1:1),
    size:Math.random()*1.8+.5,hue:Math.random()*360
  }));
}
addEventListener('resize',resize);resize();

function setupAudio(){
  if(audioContext)return;
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioContext.createAnalyser();
  analyser.fftSize=1024;
  analyser.smoothingTimeConstant=.68;
  source=audioContext.createMediaElementSource(music);
  source.connect(analyser);analyser.connect(audioContext.destination);
  freqData=new Uint8Array(analyser.frequencyBinCount);
  timeData=new Uint8Array(analyser.fftSize);
  previousSpectrum=new Float32Array(analyser.frequencyBinCount);
}
function averageBand(from,to){
  let sum=0,n=0;
  for(let i=from;i<Math.min(to,freqData.length);i++){sum+=freqData[i]/255;n++}
  return n?sum/n:0;
}
function analyseAudio(dt){
  if(!analyser||paused||music.ended)return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  const rawBass=averageBand(2,18);
  const rawMid=averageBand(18,105);
  const rawTreble=averageBand(105,250);
  const rawEnergy=averageBand(1,250);
  bass=lerp(bass,rawBass,rawBass>bass?.72:.2);
  mid=lerp(mid,rawMid,.32);treble=lerp(treble,rawTreble,.3);
  energy=lerp(energy,rawEnergy,.28);

  // Detect fresh low-frequency impacts relative to the recent bass level.
  const bassMean=bassHistory.length?bassHistory.reduce((a,b)=>a+b,0)/bassHistory.length:0;
  const bassRise=rawBass-bassMean;
  bassHistory.push(rawBass);if(bassHistory.length>24)bassHistory.shift();
  if(bassRise>.045&&rawBass>.075)beatPulse=Math.max(beatPulse,clamp(.35+bassRise*5,.35,1));

  // Spectral flux catches distinct piano attacks and other strong note onsets.
  let flux=0;
  for(let i=2;i<Math.min(170,freqData.length);i++){
    const v=freqData[i]/255;
    const rise=v-previousSpectrum[i];
    if(rise>0)flux+=rise;
    previousSpectrum[i]=v;
  }
  flux/=168;
  const fluxMean=fluxHistory.length?fluxHistory.reduce((a,b)=>a+b,0)/fluxHistory.length:0;
  fluxHistory.push(flux);if(fluxHistory.length>28)fluxHistory.shift();
  if(flux>Math.max(.006,fluxMean*1.75))notePulse=Math.max(notePulse,clamp(flux*19,.2,1));
  beatPulse*=Math.exp(-dt*5.8);
  notePulse*=Math.exp(-dt*3.8);
}
function idleAudio(dt){
  const decay=Math.exp(-dt*1.45);
  energy*=decay;bass*=decay;mid*=decay;treble*=decay;
  beatPulse*=Math.exp(-dt*2.2);notePulse*=Math.exp(-dt*1.8);
}
function drawBackground(t,e){
  ctx.fillStyle='#03020a';ctx.fillRect(0,0,W,H);
  const hue=(205+mid*110+notePulse*35+t*3)%360;
  const r=Math.min(W,H)*(.18+e*.22+beatPulse*.18);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.7);
  g.addColorStop(0,`hsla(${hue},95%,${12+e*13+beatPulse*12}%,.9)`);
  g.addColorStop(.48,`hsla(${(hue+65)%360},90%,25%,.22)`);
  g.addColorStop(1,'rgba(3,2,10,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawSpectrum(t){
  const count=112,base=Math.min(W,H)*(.19+beatPulse*.12+energy*.06);
  ctx.save();ctx.translate(cx,cy);
  for(let i=0;i<count;i++){
    const bin=Math.floor(2+i*i/count/count*230);
    const v=freqData?freqData[Math.min(bin,freqData.length-1)]/255:0;
    const angle=i/count*TAU-t*.08;
    const h=3+v*Math.min(W,H)*.22+beatPulse*9;
    const inner=base;
    const outer=inner+h;
    const hue=(190+i/count*190+t*9+notePulse*30)%360;
    ctx.strokeStyle=`hsla(${hue},100%,${58+v*28}%,${.48+v*.5})`;
    ctx.lineWidth=1.5+v*2.5+beatPulse*1.4;
    ctx.beginPath();ctx.moveTo(Math.cos(angle)*inner,Math.sin(angle)*inner);
    ctx.lineTo(Math.cos(angle)*outer,Math.sin(angle)*outer);ctx.stroke();
  }
  ctx.restore();
}
function drawWaveform(t){
  if(!timeData)return;
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();
  const radius=Math.min(W,H)*(.17+beatPulse*.07+notePulse*.035);
  for(let i=0;i<=timeData.length;i+=2){
    const idx=i%timeData.length;
    const sample=(timeData[idx]-128)/128;
    const angle=i/timeData.length*TAU-t*.035;
    const r=radius+sample*(14+energy*55+beatPulse*30);
    const x=Math.cos(angle)*r,y=Math.sin(angle)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.lineWidth=1.5+energy*2.5+beatPulse*2;
  ctx.strokeStyle=`hsla(${190+notePulse*100+t*5},100%,75%,${.45+energy*.5})`;ctx.stroke();
  ctx.restore();
}
function drawImpactRings(t){
  ctx.save();ctx.translate(cx,cy);
  for(let j=0;j<3;j++){
    const p=j===0?beatPulse:j===1?notePulse:Math.max(beatPulse*.55,notePulse*.35);
    const radius=Math.min(W,H)*(.12+j*.085)+p*85;
    ctx.beginPath();ctx.ellipse(0,0,radius,radius*(.72+j*.06),t*.05+j*.4,0,TAU);
    ctx.lineWidth=1+j*.65+p*3;
    ctx.strokeStyle=`hsla(${(195+j*65+t*7)%360},100%,${65+p*25}%,${.12+p*.75})`;
    ctx.stroke();
  }
  ctx.restore();
}
function drawParticles(t,dt){
  const activity=clamp(energy*2.1+beatPulse*.9+notePulse*.5,0,1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    p.angle+=p.speed*(.2+activity*5);
    const pulse=beatPulse*38+notePulse*18;
    const radius=p.r+pulse+Math.sin(t*.7+p.hue)*activity*12;
    const x=cx+Math.cos(p.angle)*radius,y=cy+Math.sin(p.angle)*radius*.72;
    const size=p.size*(.35+activity*1.8);
    ctx.fillStyle=`hsla(${(p.hue+t*10+notePulse*70)%360},100%,70%,${.12+activity*.78})`;
    ctx.fillRect(x,y,size,size);
  }
  ctx.restore();
}
function drawCore(t){
  const pulse=beatPulse*1.5+notePulse*.65+energy*.25;
  const radius=5+pulse*42;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.beginPath();ctx.arc(cx,cy,radius,0,TAU);
  ctx.fillStyle=`hsla(${195+notePulse*110+t*5},100%,${70+pulse*15}%,${.25+pulse*.55})`;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,2+pulse*8,0,TAU);
  ctx.fillStyle='#fff';ctx.fill();ctx.restore();
}
function render(timestamp){
  if(!started)return;
  raf=requestAnimationFrame(render);
  if(timestamp-lastFrame<1000/30)return;
  const dt=lastFrame?Math.min((timestamp-lastFrame)/1000,.05):1/30;
  lastFrame=timestamp;
  if(!paused&&!music.ended)analyseAudio(dt);else idleAudio(dt);
  const t=music.currentTime||0;
  drawBackground(t,energy);
  // Every layer is driven by measured audio energy or detected note/beat attacks.
  drawImpactRings(t);drawSpectrum(t);drawWaveform(t);drawParticles(t,dt);drawCore(t);
  $('time').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  if(music.duration&&Number.isFinite(music.duration))$('progressFill').style.width=`${t/music.duration*100}%`;
}
async function begin(){
  if(started)return;
  setupAudio();
  try{await audioContext.resume();await music.play()}
  catch(e){console.error(e);alert('Could not play the music. Check that the MP3 is still inside your assets folder.');return}
  started=true;paused=false;
  $('intro').style.opacity='0';setTimeout(()=>$('intro').style.display='none',1200);
  $('hud').classList.add('visible');lastFrame=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(render);
}
$('startButton').addEventListener('click',begin);
$('pauseButton').addEventListener('click',async()=>{
  if(!started)return;
  if(!paused){
    music.pause();paused=true;$('pauseButton').textContent='▶';
    // Keep rendering while paused: the audio-reactive energy decays smoothly to stillness.
  }else{
    try{await audioContext.resume();await music.play();paused=false;$('pauseButton').textContent='Ⅱ'}
    catch(e){console.error(e)}
  }
});
$('restartButton').addEventListener('click',async()=>{
  if(!started)return;
  music.currentTime=0;
  bassHistory=[];fluxHistory=[];beatPulse=0;notePulse=0;
  if(paused){try{await audioContext.resume();await music.play();paused=false;$('pauseButton').textContent='Ⅱ'}catch(e){console.error(e)}}
});
$('muteButton').addEventListener('click',()=>{
  muted=!muted;music.muted=muted;$('muteButton').textContent=muted?'×':'♪';
});
music.addEventListener('ended',()=>{paused=true;$('pauseButton').textContent='▶'});
</script>
</body>
</html>
