
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Visual Experience</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#02010a;
    color:white;
    font-family:Montserrat,sans-serif;
    overflow:hidden;
    height:100vh;
}

canvas {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#background { z-index:0; }
#visualizer { z-index:1; }

.vignette {
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.42) 100%);
}

.intro {
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#02010a;
    transition:opacity 2s;
}

.intro h1 {
    font-size:clamp(35px,7vw,76px);
    font-weight:200;
    letter-spacing:.42em;
    padding-left:.42em;
    opacity:0;
    animation:reveal 4s ease forwards;
}

.intro p {
    font-size:10px;
    letter-spacing:.45em;
    color:#9993bd;
    margin-top:22px;
    opacity:0;
    animation:reveal 3s ease 1.5s forwards;
}

.start {
    margin-top:65px;
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:white;
    padding:16px 36px;
    font-family:inherit;
    font-size:10px;
    letter-spacing:.35em;
    cursor:pointer;
    transition:.4s;
    opacity:0;
    animation:reveal 2s ease 3s forwards;
}

.start:hover {
    background:white;
    color:black;
    box-shadow:0 0 35px rgba(150,120,255,.5);
}

@keyframes reveal { to { opacity:1; } }

.hud {
    position:fixed;
    z-index:3;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 3s;
}

.hud.visible { opacity:1; }

.logo {
    position:absolute;
    top:35px;
    left:42px;
    font-size:11px;
    letter-spacing:.4em;
}

.phase {
    position:absolute;
    top:38px;
    right:42px;
    font-size:9px;
    color:#aaa3c8;
    letter-spacing:.3em;
}

.track {
    position:absolute;
    bottom:42px;
    left:42px;
}

.track-name {
    font-size:11px;
    letter-spacing:.25em;
    margin-bottom:9px;
}

.track-sub {
    color:#9993bd;
    font-size:9px;
    letter-spacing:.2em;
}

.controls {
    position:absolute;
    bottom:38px;
    right:42px;
    display:flex;
    gap:18px;
    pointer-events:auto;
}

.controls button {
    color:rgba(255,255,255,.8);
    background:transparent;
    border:none;
    font-size:19px;
    cursor:pointer;
}

.controls button:hover {
    color:white;
    text-shadow:0 0 12px white;
}

.progress {
    position:absolute;
    bottom:0;
    left:0;
    height:1px;
    background:rgba(255,255,255,.15);
    width:100%;
}

.progress-fill {
    height:100%;
    width:0%;
    background:white;
}

.time {
    position:absolute;
    bottom:72px;
    right:42px;
    color:#aaa3c8;
    font-size:9px;
    letter-spacing:.15em;
}

@media(max-width:600px) {
    .logo { left:20px; top:22px; }
    .phase { right:20px; top:25px; }
    .track { left:20px; bottom:65px; }
    .controls { right:20px; bottom:22px; }
    .time { right:20px; bottom:53px; }
}
</style>
</head>

<body>

<canvas id="background"></canvas>
<canvas id="visualizer"></canvas>
<div class="vignette"></div>

<div class="intro" id="intro">
    <h1>INTERSTELLAR</h1>
    <p>A MUSICAL VISUAL EXPERIENCE</p>
    <button class="start" id="startButton">ENTER THE EXPERIENCE</button>
</div>

<div class="hud" id="hud">
    <div class="logo">INTERSTELLAR</div>
    <div class="phase" id="phase">I — AWAKENING</div>

    <div class="track">
        <div class="track-name">MAIN THEME</div>
        <div class="track-sub">HANS ZIMMER</div>
    </div>

    <div class="time" id="time">00:00</div>

    <div class="controls">
        <button id="pauseButton" title="Pause / Play">Ⅱ</button>
        <button id="restartButton" title="Restart">↺</button>
        <button id="muteButton" title="Mute">♪</button>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3" type="audio/mpeg">
</audio>

<script>
const bg = document.getElementById("background");
const canvas = document.getElementById("visualizer");
const bctx = bg.getContext("2d");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");

let width, height, cx, cy;
let started = false;
let paused = false;
let muted = false;

let analyser, audioContext, source, frequencyData;

let stars = [];
let particles = [];
let streams = [];
let clouds = [];

let animationTime = 0;
let lastFrame = 0;

const TAU = Math.PI * 2;

// Performance settings
const FPS = 30;
const FRAME_TIME = 1000 / FPS;
const PARTICLE_COUNT = 260;
const STAR_COUNT = 220;

// Reusable cloud image
const cloudTexture = document.createElement("canvas");
cloudTexture.width = 256;
cloudTexture.height = 256;

const cloudCtx = cloudTexture.getContext("2d");
const cloudGradient = cloudCtx.createRadialGradient(128,128,0,128,128,128);

cloudGradient.addColorStop(0,"rgba(255,255,255,.65)");
cloudGradient.addColorStop(.25,"rgba(255,255,255,.25)");
cloudGradient.addColorStop(.6,"rgba(255,255,255,.07)");
cloudGradient.addColorStop(1,"rgba(255,255,255,0)");

cloudCtx.fillStyle = cloudGradient;
cloudCtx.fillRect(0,0,256,256);

function random(min,max) {
    return Math.random()*(max-min)+min;
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    cx = width/2;
    cy = height/2;

    // Render below full device pixel resolution for better performance.
    const scale = Math.min(window.devicePixelRatio || 1, 1) * .85;

    for(const c of [bg,canvas]) {
        c.width = Math.round(width*scale);
        c.height = Math.round(height*scale);

        c.style.width = width+"px";
        c.style.height = height+"px";

        c.getContext("2d").setTransform(scale,0,0,scale,0,0);
    }

    createStars();
    createParticles();
    createStreams();
    createClouds();
}

window.addEventListener("resize",resize);

function createStars() {
    stars = [];

    for(let i=0;i<STAR_COUNT;i++) {
        stars.push({
            x:random(0,width),
            y:random(0,height),
            size:random(.3,1.5),
            alpha:random(.2,.85)
        });
    }

    // Stars are static, so draw them only once.
    bctx.clearRect(0,0,width,height);

    for(const s of stars) {
        bctx.beginPath();
        bctx.arc(s.x,s.y,s.size,0,TAU);
        bctx.fillStyle=`rgba(190,200,255,${s.alpha})`;
        bctx.fill();
    }
}

function createParticles() {
    particles = [];

    for(let i=0;i<PARTICLE_COUNT;i++) {
        particles.push({
            angle:random(0,TAU),
            radius:random(35,Math.max(width,height)*.65),
            speed:random(.001,.004),
            size:random(.7,2.2),
            wave:random(0,TAU),
            alpha:random(.3,.9)
        });
    }
}

function createStreams() {
    streams = [];

    for(let i=0;i<6;i++) {
        streams.push({
            angle:random(0,TAU),
            radius:random(100,Math.max(width,height)*.45),
            speed:random(.002,.006),
            length:random(100,260),
            hue:i*55
        });
    }
}

function createClouds() {
    clouds = [];

    for(let i=0;i<6;i++) {
        clouds.push({
            x:random(0,width),
            y:random(0,height),
            size:random(180,380),
            hue:random(180,330),
            speed:random(.15,.55),
            phase:random(0,TAU)
        });
    }
}

resize();

// Audio setup
function initializeAudio() {
    if(audioContext) return;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = .85;

    source = audioContext.createMediaElementSource(music);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
}

function getAudio() {
    if(!analyser || muted) {
        return {volume:0,bass:0,treble:0};
    }

    analyser.getByteFrequencyData(frequencyData);

    let bass=0, treble=0, volume=0;

    for(let i=0;i<frequencyData.length;i++) {
        const value=frequencyData[i]/255;
        volume+=value;

        if(i<12) bass+=value;
        if(i>30) treble+=value;
    }

    return {
        volume:volume/frequencyData.length,
        bass:bass/12,
        treble:treble/(frequencyData.length-31)
    };
}

// Color progression
const phases = [
    {time:0,name:"I — AWAKENING",colors:[220,260,190],power:.8},
    {time:35,name:"II — ASCENSION",colors:[260,190,320],power:1},
    {time:80,name:"III — INFINITY",colors:[290,330,200],power:1.3},
    {time:135,name:"IV — TRANSCENDENCE",colors:[35,190,270],power:1.5},
    {time:190,name:"V — BEYOND",colors:[190,220,300],power:1.7},
    {time:250,name:"VI — ETERNITY",colors:[260,210,40],power:.9}
];

function getPhase(seconds) {
    let result=phases[0];

    for(const p of phases) {
        if(seconds>=p.time) result=p;
    }

    return result;
}

// Background color clouds
function drawClouds(phase,audio) {
    ctx.save();
    ctx.globalCompositeOperation="screen";

    for(let i=0;i<clouds.length;i++) {
        const c=clouds[i];
        const hue=phase.colors[i%3];

        const x=c.x+Math.sin(animationTime*c.speed+c.phase)*100;
        const y=c.y+Math.cos(animationTime*c.speed*.8+c.phase)*75;
        const size=c.size*(1+audio.bass*.3);

        ctx.globalAlpha=.35+audio.volume*.3;
        ctx.fillStyle=`hsl(${hue},100%,55%)`;

        ctx.drawImage(
            cloudTexture,
            x-size/2,
            y-size/2,
            size,
            size
        );
    }

    ctx.restore();
}

// Swirling particles
function drawParticles(phase,audio) {
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(const p of particles) {
        p.angle+=p.speed*(1+audio.volume*5)*phase.power;

        const distortion=Math.sin(animationTime*1.5+p.wave)*30;
        const radius=p.radius+distortion+audio.bass*35;

        const x=cx+Math.cos(p.angle)*radius;
        const y=cy+Math.sin(p.angle)*radius*.7;

        const hue=phase.colors[Math.floor((p.angle/TAU*3+3)%3)];
        const size=p.size+audio.treble*1.5;

        ctx.beginPath();
        ctx.arc(x,y,size,0,TAU);

        ctx.fillStyle=`hsla(${hue},100%,72%,${p.alpha})`;
        ctx.fill();
    }

    ctx.restore();
}

// Moving light streams
function drawStreams(phase,audio) {
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(let i=0;i<streams.length;i++) {
        const s=streams[i];

        s.angle+=s.speed*(1+audio.volume*3);

        const x=cx+Math.cos(s.angle)*s.radius;
        const y=cy+Math.sin(s.angle)*s.radius*.7;

        const length=s.length*(1+audio.bass);

        ctx.beginPath();
        ctx.moveTo(x,y);

        ctx.quadraticCurveTo(
            cx+Math.cos(s.angle+1)*length*.5,
            cy+Math.sin(s.angle+1)*length*.5,
            cx+Math.cos(s.angle+.7)*length,
            cy+Math.sin(s.angle+.7)*length
        );

        const hue=phase.colors[i%3];

        ctx.strokeStyle=`hsla(${hue},100%,70%,.38)`;
        ctx.lineWidth=1.5+audio.bass*2;
        ctx.stroke();
    }

    ctx.restore();
}

// Energy rings
function drawRings(phase,audio) {
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalCompositeOperation="lighter";

    const rotation=animationTime*.15;

    for(let ring=0;ring<6;ring++) {
        const base=50+ring*38+audio.bass*45;
        const hue=phase.colors[ring%3];

        ctx.beginPath();

        // Fewer points = much less drawing work.
        for(let i=0;i<=120;i++) {
            const angle=i/120*TAU;

            const distortion=
                Math.sin(angle*5+animationTime+ring)*(9+audio.bass*35)+
                Math.sin(angle*8-animationTime)*6;

            const radius=base+distortion;
            const x=Math.cos(angle+rotation)*radius;
            const y=Math.sin(angle+rotation)*radius*.8;

            if(i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.closePath();

        ctx.strokeStyle=`hsla(${hue},100%,70%,.3)`;
        ctx.lineWidth=ring===0?2:1;
        ctx.stroke();
    }

    ctx.restore();
}

// Central glow
function drawCore(phase,audio) {
    const radius=25+audio.bass*45+Math.sin(animationTime*2)*5;

    const gradient=ctx.createRadialGradient(
        cx,cy,0,
        cx,cy,radius*7
    );

    gradient.addColorStop(0,`hsla(${phase.colors[0]},100%,80%,.5)`);
    gradient.addColorStop(.25,`hsla(${phase.colors[1]},100%,60%,.2)`);
    gradient.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=gradient;
    ctx.beginPath();
    ctx.arc(cx,cy,radius*7,0,TAU);
    ctx.fill();
}

// Main animation loop: capped at 30 FPS.
function draw(timestamp) {
    requestAnimationFrame(draw);

    if(!started || paused) return;

    if(timestamp-lastFrame<FRAME_TIME) return;

    const delta=lastFrame ? Math.min((timestamp-lastFrame)/16.67,2) : 1;
    lastFrame=timestamp;

    animationTime+=.016*delta;

    const seconds=music.currentTime||0;
    const phase=getPhase(seconds);
    const audio=getAudio();

    ctx.clearRect(0,0,width,height);

    drawClouds(phase,audio);
    drawRings(phase,audio);
    drawStreams(phase,audio);
    drawParticles(phase,audio);
    drawCore(phase,audio);

    document.getElementById("phase").textContent=phase.name;

    const current=Math.floor(seconds);
    const mins=Math.floor(current/60);
    const secs=current%60;

    document.getElementById("time").textContent=
        `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

    if(music.duration && Number.isFinite(music.duration)) {
        document.getElementById("progressFill").style.width=
            `${seconds/music.duration*100}%`;
    }
}

async function begin() {
    if(started) return;

    initializeAudio();

    try {
        await audioContext.resume();
        await music.play();
    } catch(error) {
        console.error(error);
        alert("The music couldn't start. Check that your MP3 is in the assets folder.");
        return;
    }

    started=true;
    intro.style.opacity="0";

    setTimeout(()=>intro.style.display="none",2000);

    hud.classList.add("visible");
}

document.getElementById("startButton").addEventListener("click",begin);

document.getElementById("pauseButton").addEventListener("click",async()=>{
    if(!started) return;

    if(paused) {
        try {
            await music.play();
            paused=false;
            document.getElementById("pauseButton").textContent="Ⅱ";
        } catch(error) {
            console.error(error);
        }
    } else {
        music.pause();
        paused=true;
        document.getElementById("pauseButton").textContent="▶";
    }
});

document.getElementById("muteButton").addEventListener("click",()=>{
    muted=!muted;
    music.muted=muted;
    document.getElementById("muteButton").textContent=muted?"×":"♪";
});

document.getElementById("restartButton").addEventListener("click",async()=>{
    if(!started) return;

    music.currentTime=0;

    if(paused) {
        try {
            await music.play();
            paused=false;
            document.getElementById("pauseButton").textContent="Ⅱ";
        } catch(error) {
            console.error(error);
        }
    }
});

music.addEventListener("ended",()=>{
    paused=true;
    document.getElementById("pauseButton").textContent="▶";
});

requestAnimationFrame(draw);
</script>

</body>
</html>
