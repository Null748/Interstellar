
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Particle Flight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"
onerror="this.onerror=null;this.src='https://unpkg.com/three@0.152.2/build/three.min.js'"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020108;
  color:white;
  font-family:Montserrat,sans-serif;
}

#visualizer{
  position:fixed;
  inset:0;
  z-index:1;
}

.vignette{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.4) 100%);
}

.intro{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#020108;
  transition:opacity 1.2s;
}

.intro h1{
  font-size:clamp(32px,7vw,76px);
  font-weight:200;
  letter-spacing:.42em;
  padding-left:.42em;
  opacity:0;
  animation:reveal 2.5s ease forwards;
}

.intro p{
  margin-top:22px;
  color:#c1a9f5;
  font-size:10px;
  letter-spacing:.45em;
  opacity:0;
  animation:reveal 2s ease .7s forwards;
}

.start{
  margin-top:55px;
  padding:15px 32px;
  border:1px solid rgba(255,255,255,.55);
  background:transparent;
  color:white;
  font:10px Montserrat,sans-serif;
  letter-spacing:.3em;
  cursor:pointer;
  opacity:0;
  animation:reveal 2s ease 1.4s forwards;
  transition:.25s;
}

.start:hover{
  background:white;
  color:#080510;
}

@keyframes reveal{
  to{opacity:1}
}

.hud{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  opacity:0;
  transition:opacity .8s;
}

.hud.visible{opacity:1}

.logo{
  position:absolute;
  top:34px;
  left:40px;
  font-size:11px;
  letter-spacing:.4em;
}

.phase{
  position:absolute;
  top:37px;
  right:40px;
  font-size:9px;
  letter-spacing:.25em;
  color:#d8caff;
}

.track{
  position:absolute;
  left:40px;
  bottom:40px;
}

.track-name{
  font-size:11px;
  letter-spacing:.25em;
  margin-bottom:8px;
}

.track-sub{
  font-size:9px;
  letter-spacing:.2em;
  color:#aaa0cb;
}

/* SPEED CONTROL */

.speed-control{
  position:absolute;
  right:40px;
  bottom:112px;
  width:210px;
  pointer-events:auto;
}

.speed-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.speed-label{
  font-size:9px;
  letter-spacing:.25em;
  color:#c9bce9;
}

.speed-value{
  font-size:12px;
  letter-spacing:.1em;
  color:white;
  min-width:40px;
  text-align:right;
}

.speed-slider{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:2px;
  background:rgba(255,255,255,.3);
  outline:none;
  cursor:pointer;
}

.speed-slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:11px;
  height:11px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 12px rgba(180,150,255,.8);
  cursor:grab;
}

.speed-slider::-moz-range-thumb{
  width:11px;
  height:11px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 0 12px rgba(180,150,255,.8);
  cursor:grab;
}

.speed-marks{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:#817995;
  font-size:8px;
  letter-spacing:.08em;
}

.controls{
  position:absolute;
  right:40px;
  bottom:35px;
  display:flex;
  gap:18px;
  pointer-events:auto;
}

.controls button{
  border:0;
  background:transparent;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.controls button:hover{color:#ff8cff}

.time{
  position:absolute;
  right:40px;
  bottom:70px;
  color:#c4b6e8;
  font-size:9px;
  letter-spacing:.15em;
}

.progress{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:2px;
  background:rgba(255,255,255,.15);
}

.progress-fill{
  height:100%;
  width:0;
  background:white;
}

@media(max-width:600px){
  .logo{left:18px;top:20px}
  .phase{right:18px;top:23px}
  .track{left:18px;bottom:30px}

  .speed-control{
    right:18px;
    bottom:112px;
    width:175px;
  }

  .controls{right:18px;bottom:20px}
  .time{right:18px;bottom:53px}
}
</style>
</head>

<body>

<div id="visualizer"></div>
<div class="vignette"></div>

<div class="intro" id="intro">
  <h1>INTERSTELLAR</h1>
  <p>A MUSICAL VISUAL EXPERIENCE</p>
  <button class="start" id="startButton">ENTER THE EXPERIENCE</button>
</div>

<div class="hud" id="hud">
  <div class="logo">INTERSTELLAR</div>
  <div class="phase">INFINITE PARTICLE FLIGHT</div>

  <div class="track">
    <div class="track-name">MAIN THEME</div>
    <div class="track-sub">HANS ZIMMER</div>
  </div>

  <div class="speed-control">
    <div class="speed-heading">
      <span class="speed-label">FLIGHT SPEED</span>
      <span class="speed-value" id="speedValue">1.0×</span>
    </div>

    <input
      class="speed-slider"
      id="speedSlider"
      type="range"
      min="0"
      max="3"
      step="0.1"
      value="1"
      aria-label="Flight speed"
    >

    <div class="speed-marks">
      <span>STOP</span>
      <span>1×</span>
      <span>2×</span>
      <span>3×</span>
    </div>
  </div>

  <div class="time" id="time">00:00</div>

  <div class="controls">
    <button id="pauseButton" title="Pause / Play">Ⅱ</button>
    <button id="restartButton" title="Restart">↺</button>
    <button id="muteButton" title="Mute">♪</button>
  </div>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<audio id="music" preload="auto">
  <source src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3" type="audio/mpeg">
</audio>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const music = $("music");
const mount = $("visualizer");

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;

let audioContext, analyser, audioSource, freqData;

let started=false;
let paused=false;
let muted=false;

let energy=0;
let travel=0;
let travelSpeed=0;
let targetSpeed=0;

let speedMultiplier=1;

let lastFrame=0;
let raf=0;

let renderer,scene,camera,particleMaterial;
const particleCount=26000;

const vertexShader = `
attribute float aSize;
attribute float aSeed;
attribute vec3 aColor;

uniform float uTravel;
uniform float uTime;
uniform float uEnergy;

varying vec3 vColor;
varying float vAlpha;

void main(){

  vec3 p=position;

  float seed=aSeed;

  float drift=uTime*0.12+seed*6.28318;

  p.x+=sin(drift+p.z*0.035+seed*8.0)*0.7;
  p.y+=cos(drift*0.8+p.z*0.025+seed*5.0)*0.65;

  p.z=mod(position.z+uTravel+108.0,106.0)-108.0;

  vec4 mvPosition=modelViewMatrix*vec4(p,1.0);

  float depth=max(0.5,-mvPosition.z);

  gl_PointSize=clamp(aSize*(240.0/depth),1.0,12.0);

  gl_Position=projectionMatrix*mvPosition;

  vColor=aColor*(0.88+uEnergy*0.18);

  vAlpha=clamp(1.0-depth/125.0,0.12,0.95);
}
`;

const fragmentShader = `
varying vec3 vColor;
varying float vAlpha;

void main(){

  vec2 uv=gl_PointCoord-0.5;
  float d=length(uv);

  if(d>0.5) discard;

  float core=1.0-smoothstep(0.0,0.18,d);
  float glow=exp(-d*9.0)*0.65;

  float alpha=(core+glow)*vAlpha;

  gl_FragColor=vec4(vColor*(1.0+core*0.7),alpha);
}
`;

function makeScene(){

  if(!window.THREE){
    throw new Error("Three.js did not load. Check your internet connection and reload.");
  }

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x020108);

  camera=new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    150
  );

  camera.position.set(0,0,0);
  camera.rotation.set(0,0,0);

  renderer=new THREE.WebGLRenderer({
    antialias:false,
    alpha:false,
    powerPreference:"high-performance",
    stencil:false,
    depth:true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  mount.appendChild(renderer.domElement);

  const positions=new Float32Array(particleCount*3);
  const sizes=new Float32Array(particleCount);
  const seeds=new Float32Array(particleCount);
  const colors=new Float32Array(particleCount*3);

  const palette=[
    [0.10,0.75,1.0],
    [0.35,0.25,1.0],
    [0.85,0.25,1.0],
    [1.0,0.35,0.72],
    [0.45,0.9,1.0],
    [1.0,0.65,0.4],
    [0.75,0.65,1.0]
  ];

  for(let i=0;i<particleCount;i++){

    const angle=Math.random()*Math.PI*2;
    const radius=Math.sqrt(Math.random())*27;

    positions[i*3]=Math.cos(angle)*radius;
    positions[i*3+1]=Math.sin(angle)*radius;
    positions[i*3+2]=-2-Math.random()*106;

    sizes[i]=0.45+Math.random()*2.0;
    seeds[i]=Math.random();

    const c=palette[Math.floor(Math.random()*palette.length)];
    const brightness=0.55+Math.random()*0.85;

    colors[i*3]=c[0]*brightness;
    colors[i*3+1]=c[1]*brightness;
    colors[i*3+2]=c[2]*brightness;
  }

  const geometry=new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions,3)
  );

  geometry.setAttribute(
    "aSize",
    new THREE.BufferAttribute(sizes,1)
  );

  geometry.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(seeds,1)
  );

  geometry.setAttribute(
    "aColor",
    new THREE.BufferAttribute(colors,3)
  );

  particleMaterial=new THREE.ShaderMaterial({

    uniforms:{
      uTravel:{value:0},
      uTime:{value:0},
      uEnergy:{value:0}
    },

    vertexShader,
    fragmentShader,

    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  const particles=new THREE.Points(
    geometry,
    particleMaterial
  );

  scene.add(particles);
}

function setupAudio(){

  if(audioContext)return;

  const AudioCtx=window.AudioContext||window.webkitAudioContext;

  if(!AudioCtx){
    throw new Error("Your browser does not support the Web Audio API.");
  }

  audioContext=new AudioCtx();

  analyser=audioContext.createAnalyser();
  analyser.fftSize=2048;
  analyser.smoothingTimeConstant=0.82;

  audioSource=audioContext.createMediaElementSource(music);

  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);

  freqData=new Uint8Array(analyser.frequencyBinCount);
}

function analyseAudio(){

  if(!analyser||paused||music.ended)return;

  analyser.getByteFrequencyData(freqData);

  let sum=0;

  for(let i=2;i<400;i++){
    sum+=freqData[i]/255;
  }

  const rawEnergy=sum/398;

  energy=lerp(
    energy,
    rawEnergy,
    rawEnergy>energy?0.12:0.035
  );

  // Music gently influences the base flight speed.
  // The slider controls the overall speed multiplier.
  targetSpeed=lerp(
    7.5,
    17.0,
    clamp(energy*2.2,0,1)
  )*speedMultiplier;
}

function updateFlight(dt){

  if(paused||music.ended){
    targetSpeed=0;
  }else{
    analyseAudio();
  }

  travelSpeed=lerp(
    travelSpeed,
    targetSpeed,
    1-Math.exp(-dt*(paused||speedMultiplier===0?2.5:1.1))
  );

  travel+=travelSpeed*dt;
  travel=travel%106;

  const t=performance.now()*0.0001;

  // Stop camera drifting when the speed is set to zero.
  const movementFactor=speedMultiplier===0?0:1;

  camera.position.x=Math.sin(t)*0.35*movementFactor;
  camera.position.y=Math.cos(t*0.8)*0.22*movementFactor;

  camera.rotation.x=Math.sin(t*0.7)*0.003*movementFactor;
  camera.rotation.y=Math.sin(t)*0.006*movementFactor;

  particleMaterial.uniforms.uTravel.value=travel;
  particleMaterial.uniforms.uTime.value=performance.now()*0.001;
  particleMaterial.uniforms.uEnergy.value=energy;
}

function render(timestamp){

  if(!started)return;

  raf=requestAnimationFrame(render);

  const dt=lastFrame
    ?Math.min((timestamp-lastFrame)/1000,0.05)
    :1/60;

  lastFrame=timestamp;

  updateFlight(dt);

  renderer.render(scene,camera);

  const t=music.currentTime||0;

  $("time").textContent=
    `${String(Math.floor(t/60)).padStart(2,"0")}:`+
    `${String(Math.floor(t%60)).padStart(2,"0")}`;

  if(music.duration&&Number.isFinite(music.duration)){
    $("progressFill").style.width=
      `${t/music.duration*100}%`;
  }
}

async function begin(){

  if(started)return;

  try{

    if(!renderer)makeScene();

    setupAudio();

    await audioContext.resume();
    await music.play();

    started=true;
    paused=false;

    $("intro").style.opacity="0";

    window.setTimeout(()=>{
      $("intro").style.display="none";
    },1200);

    $("hud").classList.add("visible");

    lastFrame=0;

    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(render);

  }catch(error){

    console.error(error);

    alert(
      error.message||
      "Could not start the experience. Check that the MP3 is still inside your assets folder."
    );
  }
}

$("startButton").addEventListener("click",begin);

// SPEED SLIDER

$("speedSlider").addEventListener("input",event=>{

  speedMultiplier=parseFloat(event.target.value);

  $("speedValue").textContent=
    speedMultiplier.toFixed(1)+"×";

  if(speedMultiplier===0){
    targetSpeed=0;
  }else if(!paused&&!music.ended){
    targetSpeed*=speedMultiplier;
  }
});

$("pauseButton").addEventListener("click",async()=>{

  if(!started)return;

  if(!paused){

    music.pause();
    paused=true;

    $("pauseButton").textContent="▶";

  }else{

    try{

      await audioContext.resume();
      await music.play();

      paused=false;

      $("pauseButton").textContent="Ⅱ";

    }catch(error){
      console.error(error);
    }
  }
});

$("restartButton").addEventListener("click",async()=>{

  if(!started)return;

  music.currentTime=0;

  if(paused){

    try{

      await audioContext.resume();
      await music.play();

      paused=false;

      $("pauseButton").textContent="Ⅱ";

    }catch(error){
      console.error(error);
    }
  }
});

$("muteButton").addEventListener("click",()=>{

  muted=!muted;

  music.muted=muted;

  $("muteButton").textContent=muted?"×":"♪";
});

window.addEventListener("resize",()=>{

  if(!camera||!renderer)return;

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio||1,1.25)
  );

  renderer.setSize(window.innerWidth,window.innerHeight);
});

music.addEventListener("ended",()=>{

  paused=true;

  $("pauseButton").textContent="▶";
});

})();
</script>

</body>
</html>
