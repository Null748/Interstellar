
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Visual Experience</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020207;
    color: white;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
    height: 100vh;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#background {
    z-index: 0;
}

#visualizer {
    z-index: 1;
}

.vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle, transparent 25%, rgba(0,0,0,.45) 100%);
}

.intro {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #020207;
    transition: opacity 2s ease;
}

.intro h1 {
    font-size: clamp(35px, 7vw, 76px);
    font-weight: 200;
    letter-spacing: .42em;
    padding-left: .42em;
    opacity: 0;
    animation: reveal 4s ease forwards;
}

.intro p {
    font-size: 10px;
    letter-spacing: .45em;
    color: #777b94;
    margin-top: 22px;
    opacity: 0;
    animation: reveal 3s ease 1.5s forwards;
}

.start {
    margin-top: 65px;
    background: transparent;
    border: 1px solid rgba(255,255,255,.35);
    color: white;
    padding: 15px 34px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: .35em;
    cursor: pointer;
    transition: .4s;
    opacity: 0;
    animation: reveal 2s ease 3s forwards;
}

.start:hover {
    background: white;
    color: black;
    box-shadow: 0 0 35px rgba(255,255,255,.3);
}

@keyframes reveal {
    to { opacity: 1; }
}

.hud {
    position: fixed;
    z-index: 3;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s;
}

.hud.visible {
    opacity: 1;
}

.logo {
    position: absolute;
    top: 35px;
    left: 42px;
    font-size: 11px;
    letter-spacing: .4em;
    font-weight: 300;
}

.track {
    position: absolute;
    bottom: 42px;
    left: 42px;
}

.track-name {
    font-size: 11px;
    letter-spacing: .25em;
    margin-bottom: 9px;
}

.track-sub {
    color: #777b94;
    font-size: 9px;
    letter-spacing: .2em;
}

.phase {
    position: absolute;
    top: 38px;
    right: 42px;
    font-size: 9px;
    color: #8d91a9;
    letter-spacing: .3em;
}

.controls {
    position: absolute;
    bottom: 38px;
    right: 42px;
    display: flex;
    gap: 18px;
    pointer-events: auto;
}

.controls button {
    color: rgba(255,255,255,.7);
    background: transparent;
    border: none;
    font-size: 17px;
    cursor: pointer;
    transition: .3s;
}

.controls button:hover {
    color: white;
    text-shadow: 0 0 15px white;
}

.progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 1px;
    background: rgba(255,255,255,.15);
    width: 100%;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,.7);
}

.time {
    position: absolute;
    bottom: 72px;
    right: 42px;
    color: #777b94;
    font-size: 9px;
    letter-spacing: .15em;
}

@media(max-width:600px) {
    .logo { left: 20px; top: 22px; }
    .phase { right: 20px; top: 25px; }
    .track { left: 20px; bottom: 65px; }
    .controls { right: 20px; bottom: 22px; }
    .time { right: 20px; bottom: 53px; }
}
</style>
</head>

<body>

<canvas id="background"></canvas>
<canvas id="visualizer"></canvas>
<div class="vignette"></div>

<div class="intro" id="intro">
    <h1>INTERSTELLAR</h1>
    <p>A MUSICAL VISUAL EXPERIENCE</p>
    <button class="start" id="startButton">ENTER THE EXPERIENCE</button>
</div>

<div class="hud" id="hud">
    <div class="logo">INTERSTELLAR</div>
    <div class="phase" id="phase">I — AWAKENING</div>

    <div class="track">
        <div class="track-name">MAIN THEME</div>
        <div class="track-sub">HANS ZIMMER</div>
    </div>

    <div class="time" id="time">00:00</div>

    <div class="controls">
        <button id="pauseButton" title="Pause / Play">Ⅱ</button>
        <button id="restartButton" title="Restart">↺</button>
        <button id="muteButton" title="Mute">♪</button>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3" type="audio/mpeg">
</audio>

<script>
const bg = document.getElementById("background");
const canvas = document.getElementById("visualizer");
const bctx = bg.getContext("2d");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const intro = document.getElementById("intro");
const hud = document.getElementById("hud");

let width, height, cx, cy;
let started = false;
let muted = false;
let paused = false;
let animationTime = 0;
let startTime = 0;
let analyser, audioContext, source;
let frequencyData;
let particles = [];
let stars = [];

function resize() {
    width = bg.width = canvas.width = window.innerWidth;
    height = bg.height = canvas.height = window.innerHeight;
    cx = width / 2;
    cy = height / 2;

    createStars();
    createParticles();
}

window.addEventListener("resize", resize);

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createStars() {
    stars = [];

    for (let i = 0; i < 350; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: random(.3, 1.5),
            alpha: random(.1, .8),
            speed: random(.001, .008)
        });
    }
}

function createParticles() {
    particles = [];

    for (let i = 0; i < 240; i++) {
        particles.push({
            angle: random(0, Math.PI * 2),
            radius: random(30, Math.max(width, height) * .65),
            speed: random(.0002, .001),
            size: random(.5, 2),
            offset: random(0, 100),
            alpha: random(.15, .8)
        });
    }
}

resize();

function getAudioLevel() {
    if (!analyser || !frequencyData || muted) return 0;

    analyser.getByteFrequencyData(frequencyData);

    let total = 0;
    for (let i = 0; i < frequencyData.length; i++) {
        total += frequencyData[i];
    }

    return total / frequencyData.length / 255;
}

function getBass() {
    if (!analyser || !frequencyData || muted) return 0;

    analyser.getByteFrequencyData(frequencyData);

    let total = 0;
    for (let i = 0; i < 12; i++) {
        total += frequencyData[i];
    }

    return total / 12 / 255;
}

function getTreble() {
    if (!analyser || !frequencyData || muted) return 0;

    analyser.getByteFrequencyData(frequencyData);

    let total = 0;
    for (let i = 25; i < 100; i++) {
        total += frequencyData[i] || 0;
    }

    return total / 75 / 255;
}

// Automatic visual progression
const phases = [
    { time: 0, name: "I — AWAKENING", color: [70, 85, 155], intensity: .45 },
    { time: 35, name: "II — ASCENSION", color: [90, 75, 180], intensity: .7 },
    { time: 80, name: "III — INFINITY", color: [160, 105, 190], intensity: 1 },
    { time: 135, name: "IV — BEYOND", color: [190, 145, 105], intensity: 1.3 },
    { time: 190, name: "V — TRANSCENDENCE", color: [120, 160, 220], intensity: 1.5 },
    { time: 250, name: "VI — ETERNITY", color: [210, 190, 155], intensity: .85 }
];

function getPhase(seconds) {
    let selected = phases[0];

    for (const p of phases) {
        if (seconds >= p.time) selected = p;
    }

    return selected;
}

function drawStars() {
    bctx.clearRect(0, 0, width, height);

    for (const star of stars) {
        const pulse = Math.sin(animationTime * star.speed * 60) * .25;

        bctx.beginPath();
        bctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        bctx.fillStyle = `rgba(190,200,255,${Math.max(.05, star.alpha + pulse)})`;
        bctx.fill();
    }
}

function drawParticles(phase, level) {
    const color = phase.color;

    for (const p of particles) {
        p.angle += p.speed * (1 + level * 4);

        const wave = Math.sin(animationTime * .4 + p.offset) * 25;
        const radius = p.radius + wave + level * 35;

        const x = cx + Math.cos(p.angle) * radius;
        const y = cy + Math.sin(p.angle) * radius * .62;

        ctx.beginPath();
        ctx.arc(x, y, p.size + level * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${p.alpha * phase.intensity})`;
        ctx.fill();
    }
}

function drawWaves(phase, level, bass) {
    const color = phase.color;

    for (let ring = 0; ring < 7; ring++) {
        ctx.beginPath();

        const baseRadius = 65 + ring * 39;
        const rotation = animationTime * (.08 + ring * .006);

        for (let i = 0; i <= 360; i += 2) {
            const angle = i * Math.PI / 180;
            const distortion =
                Math.sin(angle * 5 + animationTime * 1.2 + ring) * (8 + bass * 32) +
                Math.sin(angle * 9 - animationTime * .7) * (4 + level * 20);

            const radius = baseRadius + distortion;
            const x = cx + Math.cos(angle + rotation) * radius;
            const y = cy + Math.sin(angle + rotation) * radius * .8;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }

        ctx.closePath();

        ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${.12 + level * .18})`;
        ctx.lineWidth = ring === 0 ? 1.5 : .7;
        ctx.shadowBlur = 18 + bass * 35;
        ctx.shadowColor = `rgb(${color[0]},${color[1]},${color[2]})`;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

function drawCore(phase, level, bass) {
    const color = phase.color;
    const pulse = Math.sin(animationTime * 1.1) * 5 + bass * 45;

    const radius = 20 + pulse;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 5);
    glow.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${.3 + level * .2})`);
    glow.addColorStop(.3, `rgba(${color[0]},${color[1]},${color[2]},.08)`);
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},.16)`;
    ctx.shadowBlur = 45 + bass * 60;
    ctx.shadowColor = `rgb(${color[0]},${color[1]},${color[2]})`;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function draw() {
    requestAnimationFrame(draw);

    if (!started || paused) return;

    animationTime += .016;

    const seconds = music.currentTime || 0;
    const phase = getPhase(seconds);

    const level = getAudioLevel();
    const bass = getBass();
    const treble = getTreble();

    ctx.clearRect(0, 0, width, height);

    // Subtle central atmospheric glow
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * .65);
    glow.addColorStop(0, `rgba(${phase.color.join(",")},${.035 + level * .06})`);
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    drawCore(phase, level, bass);
    drawWaves(phase, level, bass);
    drawParticles(phase, level + treble * .3);

    document.getElementById("phase").textContent = phase.name;

    const current = Math.floor(music.currentTime);
    const mins = Math.floor(current / 60);
    const secs = current % 60;

    document.getElementById("time").textContent =
        `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

    if (music.duration) {
        document.getElementById("progressFill").style.width =
            `${(music.currentTime / music.duration) * 100}%`;
    }
}

function initializeAudio() {
    if (audioContext) return;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = .88;

    source = audioContext.createMediaElementSource(music);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    frequencyData = new Uint8Array(analyser.frequencyBinCount);
}

async function begin() {
    if (started) return;

    initializeAudio();

    try {
        await audioContext.resume();
        await music.play();
    } catch (error) {
        console.error("Audio could not start:", error);
        alert("The music couldn't start. Check that your MP3 is in the assets folder and try again.");
        return;
    }

    started = true;
    startTime = performance.now();

    intro.style.opacity = "0";
    setTimeout(() => intro.style.display = "none", 2000);

    hud.classList.add("visible");

    draw();
}

document.getElementById("startButton").addEventListener("click", begin);

document.getElementById("pauseButton").addEventListener("click", async () => {
    if (!started) return;

    if (paused) {
        await music.play();
        paused = false;
        document.getElementById("pauseButton").textContent = "Ⅱ";
    } else {
        music.pause();
        paused = true;
        document.getElementById("pauseButton").textContent = "▶";
    }
});

document.getElementById("muteButton").addEventListener("click", () => {
    muted = !muted;
    music.muted = muted;
    document.getElementById("muteButton").textContent = muted ? "×" : "♪";
});

document.getElementById("restartButton").addEventListener("click", async () => {
    music.currentTime = 0;
    if (paused) {
        await music.play();
        paused = false;
        document.getElementById("pauseButton").textContent = "Ⅱ";
    }
});

music.addEventListener("ended", () => {
    paused = true;
    document.getElementById("pauseButton").textContent = "▶";
});

drawStars();
</script>

</body>
</html>
