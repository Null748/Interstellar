
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Beyond the Known</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020306;
    color: white;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
}

/* SPACE */

.space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 50%,
        #10131b 0%,
        #080a10 35%,
        #020306 80%);
    z-index: -5;
}

#stars {
    position: fixed;
    inset: 0;
    z-index: -3;
}

/* CINEMATIC VIGNETTE */

.vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0,0,0,.35) 65%,
        #000 120%
    );
}

/* BLACK HOLE */

.camera {
    position: fixed;
    width: 100vw;
    height: 100vh;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: -2;
    transform: scale(1.1);
    animation: cameraMove 35s ease-in-out forwards;
}

.blackhole {
    position: relative;
    width: min(55vw, 650px);
    aspect-ratio: 1;
    border-radius: 50%;
    opacity: 0;
    transform: scale(.55);
    animation: blackholeReveal 12s ease forwards;
}

.accretion {
    position: absolute;
    inset: 16%;
    border-radius: 50%;
    background:
        conic-gradient(
            from 30deg,
            transparent,
            #c18d55,
            #f5d8a1,
            #fff1cf,
            #a66c42,
            transparent,
            #d4a36c,
            transparent
        );
    filter: blur(12px);
    transform: rotateX(72deg) rotate(-15deg) scale(1.55);
    box-shadow: 0 0 70px rgba(216,161,103,.35);
}

.disk {
    position: absolute;
    inset: 24%;
    border-radius: 50%;
    background: #020204;
    box-shadow:
        0 0 25px 15px #000,
        0 0 55px 20px rgba(0,0,0,.9);
    z-index: 2;
}

.inner-glow {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    border: 3px solid rgba(255,221,171,.35);
    filter: blur(8px);
    transform: rotateX(72deg) scale(1.5);
}

@keyframes blackholeReveal {
    0% {
        opacity: 0;
        transform: scale(.55);
    }
    35% {
        opacity: .9;
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes cameraMove {
    from { transform: scale(1.1) translateY(0); }
    to { transform: scale(1.45) translateY(-2%); }
}

/* OPENING TEXT */

.opening {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    z-index: 5;
    padding: 20px;
}

.pre-title {
    font-size: 9px;
    letter-spacing: 8px;
    color: rgba(255,255,255,.5);
    opacity: 0;
    animation: fadeIn 3s ease 2s forwards;
}

.main-title {
    font-size: clamp(35px, 8vw, 100px);
    font-weight: 200;
    letter-spacing: clamp(7px, 2vw, 23px);
    margin-left: clamp(7px, 2vw, 23px);
    margin-top: 35px;
    opacity: 0;
    filter: blur(10px);
    animation: titleReveal 6s ease 7s forwards;
    text-shadow: 0 0 35px rgba(255,255,255,.18);
}

.tagline {
    font-size: 9px;
    letter-spacing: 6px;
    margin-top: 25px;
    color: rgba(255,255,255,.55);
    opacity: 0;
    animation: fadeIn 4s ease 11s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes titleReveal {
    0% {
        opacity: 0;
        filter: blur(10px);
        transform: translateY(15px);
    }
    100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
    }
}

/* START BUTTON */

.start-screen {
    position: fixed;
    inset: 0;
    background: #020306;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
    transition: opacity 2s ease, visibility 2s;
}

.start-screen.hide {
    opacity: 0;
    visibility: hidden;
}

.start-screen p {
    font-size: 9px;
    letter-spacing: 6px;
    color: rgba(255,255,255,.55);
}

.start-button {
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,.35);
    padding: 17px 35px;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: .5s;
}

.start-button:hover {
    background: white;
    color: black;
    border-color: white;
}

/* CONTINUE */

.continue {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s;
    z-index: 8;
}

.continue.show {
    opacity: 1;
    pointer-events: auto;
}

.continue button {
    background: none;
    border: none;
    color: white;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: .4s;
}

.continue button:hover {
    letter-spacing: 9px;
    color: #d8bd93;
}

.continue-line {
    width: 1px;
    height: 35px;
    background: linear-gradient(white, transparent);
}

/* SOUND CONTROL */

.sound {
    position: fixed;
    right: 35px;
    bottom: 30px;
    z-index: 15;
    background: transparent;
    color: rgba(255,255,255,.6);
    border: none;
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 2s;
}

.sound.show {
    opacity: 1;
}

/* SECOND SCREEN */

.next-screen {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at center,
        #101725,
        #030407 75%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2.5s, visibility 2.5s;
    z-index: 10;
}

.next-screen.active {
    opacity: 1;
    visibility: visible;
}

.next-screen h2 {
    font-size: clamp(30px, 6vw, 65px);
    font-weight: 200;
    letter-spacing: 12px;
}

.next-screen p {
    max-width: 550px;
    font-size: 11px;
    line-height: 2.4;
    letter-spacing: 2px;
    color: rgba(255,255,255,.5);
    margin-top: 30px;
}

.next-screen button {
    margin-top: 45px;
    padding: 15px 30px;
    background: transparent;
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    font-family: inherit;
    letter-spacing: 4px;
    font-size: 9px;
    cursor: pointer;
}

/* MOBILE */

@media(max-width: 600px) {
    .blackhole {
        width: 85vw;
    }

    .pre-title {
        letter-spacing: 4px;
        font-size: 7px;
    }

    .tagline {
        letter-spacing: 3px;
    }

    .sound {
        right: 20px;
        bottom: 20px;
    }
}

</style>
</head>

<body>

<div class="space"></div>
<canvas id="stars"></canvas>
<div class="vignette"></div>

<div class="camera">
    <div class="blackhole">
        <div class="accretion"></div>
        <div class="inner-glow"></div>
        <div class="disk"></div>
    </div>
</div>

<!-- OPENING -->

<section class="opening" id="opening">

    <div class="pre-title">
        A JOURNEY THROUGH SPACE AND TIME
    </div>

    <h1 class="main-title">INTERSTELLAR</h1>

    <div class="tagline">
        BEYOND THE KNOWN
    </div>

</section>

<!-- START -->

<div class="start-screen" id="startScreen">

    <p>AN EXPERIENCE AWAITS</p>

    <button class="start-button" onclick="beginJourney()">
        BEGIN JOURNEY
    </button>

</div>

<!-- CONTINUE -->

<div class="continue" id="continue">
    <button onclick="continueJourney()">CONTINUE</button>
    <div class="continue-line"></div>
</div>

<!-- SOUND -->

<button class="sound" id="sound" onclick="toggleSound()">
    SOUND: ON
</button>

<!-- NEXT SCREEN -->

<section class="next-screen" id="nextScreen">

    <div class="pre-title" style="opacity:1">
        THROUGH SPACE AND TIME
    </div>

    <h2>DO NOT GO GENTLE.</h2>

    <p>
        Mankind was born on Earth.
        It was never meant to die here.

        <br><br>

        Somewhere beyond the stars lies a future
        we cannot yet imagine.
    </p>

    <button onclick="returnToOpening()">
        RETURN
    </button>

</section>

<!-- AUDIO -->

<audio id="music" src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3"
loop preload="auto"></audio>

<script>

// STARS

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    stars = [];

    for (let i = 0; i < 250; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.4,
            speed: Math.random() * .25 + .03,
            opacity: Math.random()
        });
    }
}

function animateStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => {
        star.opacity += (Math.random() - .5) * .02;
        star.opacity = Math.max(.2, Math.min(1, star.opacity));

        ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();

        star.y -= star.speed;

        if (star.y < 0) {
            star.y = canvas.height;
            star.x = Math.random() * canvas.width;
        }
    });

    requestAnimationFrame(animateStars);
}

window.addEventListener("resize", resize);

resize();
animateStars();

// MUSIC

const music = document.getElementById("music");

let soundEnabled = true;
let fadeInterval = null;

function fadeMusic(target, duration) {
    clearInterval(fadeInterval);

    const startVolume = music.volume;
    const difference = target - startVolume;
    const steps = 100;
    let current = 0;

    fadeInterval = setInterval(() => {
        current++;

        music.volume = Math.max(0, Math.min(1,
            startVolume + difference * (current / steps)
        ));

        if (current >= steps) {
            clearInterval(fadeInterval);
            music.volume = target;

            if (target === 0) {
                music.pause();
            }
        }
    }, duration / steps);
}

async function beginJourney() {
    const start = document.getElementById("startScreen");

    start.classList.add("hide");

    document.getElementById("sound").classList.add("show");

    if (soundEnabled) {
        try {
            music.volume = 0;
            await music.play();
            fadeMusic(.65, 12000);
        } catch (error) {
            console.log("Music could not start:", error);
        }
    }

    // Show continue after cinematic opening
    setTimeout(() => {
        document.getElementById("continue").classList.add("show");
    }, 15000);
}

function toggleSound() {
    const button = document.getElementById("sound");

    soundEnabled = !soundEnabled;

    if (soundEnabled) {
        music.play().then(() => {
            fadeMusic(.65, 2500);
        }).catch(() => {
            soundEnabled = false;
        });

        button.textContent = "SOUND: ON";
    } else {
        fadeMusic(0, 2000);
        button.textContent = "SOUND: OFF";
    }
}

// TRANSITIONS

function continueJourney() {
    fadeMusic(.4, 2500);

    document.getElementById("continue").classList.remove("show");
    document.getElementById("opening").style.opacity = "0";

    document.getElementById("nextScreen").classList.add("active");
}

function returnToOpening() {
    document.getElementById("nextScreen").classList.remove("active");

    document.getElementById("opening").style.opacity = "1";

    document.getElementById("continue").classList.add("show");
}

</script>

</body>
</html>
