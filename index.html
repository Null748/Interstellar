
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERSTELLAR — Visual Experience</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#03000b;
    color:white;
    font-family:Montserrat,sans-serif;
    height:100vh;
    overflow:hidden;
}

canvas {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#visualizer { z-index:1; }

.vignette {
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.3));
}

.intro {
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#03000b;
    transition:opacity 1.5s;
}

.intro h1 {
    font-size:clamp(35px,7vw,76px);
    font-weight:200;
    letter-spacing:.42em;
    padding-left:.42em;
    opacity:0;
    animation:reveal 3s ease forwards;
}

.intro p {
    font-size:10px;
    letter-spacing:.45em;
    color:#b8a6e8;
    margin-top:22px;
    opacity:0;
    animation:reveal 2s ease 1s forwards;
}

.start {
    margin-top:60px;
    background:transparent;
    border:1px solid rgba(255,255,255,.5);
    color:white;
    padding:16px 36px;
    font-family:inherit;
    font-size:10px;
    letter-spacing:.35em;
    cursor:pointer;
    opacity:0;
    animation:reveal 2s ease 2s forwards;
}

.start:hover {
    background:white;
    color:black;
}

@keyframes reveal { to { opacity:1; } }

.hud {
    position:fixed;
    z-index:3;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s;
}

.hud.visible { opacity:1; }

.logo {
    position:absolute;
    top:35px;
    left:42px;
    font-size:11px;
    letter-spacing:.4em;
}

.phase {
    position:absolute;
    top:38px;
    right:42px;
    font-size:9px;
    color:#d4c8ff;
    letter-spacing:.3em;
}

.track {
    position:absolute;
    bottom:42px;
    left:42px;
}

.track-name {
    font-size:11px;
    letter-spacing:.25em;
    margin-bottom:9px;
}

.track-sub {
    color:#aaa0cb;
    font-size:9px;
    letter-spacing:.2em;
}

.controls {
    position:absolute;
    bottom:38px;
    right:42px;
    display:flex;
    gap:18px;
    pointer-events:auto;
}

.controls button {
    color:white;
    background:transparent;
    border:none;
    font-size:19px;
    cursor:pointer;
}

.controls button:hover { color:#ff8cff; }

.progress {
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:2px;
    background:rgba(255,255,255,.15);
}

.progress-fill {
    height:100%;
    width:0%;
    background:#fff;
}

.time {
    position:absolute;
    bottom:72px;
    right:42px;
    color:#c4b6e8;
    font-size:9px;
    letter-spacing:.15em;
}

@media(max-width:600px) {
    .logo { left:20px; top:22px; }
    .phase { right:20px; top:25px; }
    .track { left:20px; bottom:65px; }
    .controls { right:20px; bottom:22px; }
    .time { right:20px; bottom:53px; }
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>
<div class="vignette"></div>

<div class="intro" id="intro">
    <h1>INTERSTELLAR</h1>
    <p>A MUSICAL VISUAL EXPERIENCE</p>
    <button class="start" id="startButton">ENTER THE EXPERIENCE</button>
</div>

<div class="hud" id="hud">
    <div class="logo">INTERSTELLAR</div>
    <div class="phase" id="phase">I — AWAKENING</div>

    <div class="track">
        <div class="track-name">MAIN THEME</div>
        <div class="track-sub">HANS ZIMMER</div>
    </div>

    <div class="time" id="time">00:00</div>

    <div class="controls">
        <button id="pauseButton" title="Pause / Play">Ⅱ</button>
        <button id="restartButton" title="Restart">↺</button>
        <button id="muteButton" title="Mute">♪</button>
    </div>

    <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<audio id="music" preload="auto">
    <source src="assets/Hans_Zimmer_-_Interstellar_Main_Theme_OST_INTERSTELLER_(mp3.pm)%20(1).mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d", {alpha:false});
const music = document.getElementById("music");

let W,H,cx,cy,scale;
let started=false,paused=false,muted=false;
let audioContext,analyser,source,data;
let clock=0,lastFrame=0;
let particles=[],ribbons=[],stars=[];

const TAU=Math.PI*2;
const FPS=30;
const FRAME=1000/FPS;
const PARTICLE_COUNT=190;

const palettes=[
    {name:"I — AWAKENING",hues:[195,260,315]},
    {name:"II — ASCENSION",hues:[275,320,185]},
    {name:"III — INFINITY",hues:[315,185,45]},
    {name:"IV — TRANSCENDENCE",hues:[35,190,280]},
    {name:"V — BEYOND",hues:[185,235,325]},
    {name:"VI — ETERNITY",hues:[265,45,190]}
];

function rand(a,b){return Math.random()*(b-a)+a;}

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    cx=W/2;
    cy=H/2;

    // Lower internal resolution keeps the effects lightweight.
    scale=Math.min(window.devicePixelRatio||1,1)*.72;

    canvas.width=Math.round(W*scale);
    canvas.height=Math.round(H*scale);
    ctx.setTransform(scale,0,0,scale,0,0);

    makeParticles();
    makeRibbons();
    makeStars();
}

window.addEventListener("resize",resize);

function makeParticles(){
    particles=[];
    for(let i=0;i<PARTICLE_COUNT;i++){
        particles.push({
            angle:rand(0,TAU),
            radius:rand(25,Math.max(W,H)*.65),
            speed:rand(.006,.023)*(Math.random()<.5?-1:1),
            size:rand(.8,2.5),
            wave:rand(0,TAU),
            hue:rand(0,360),
            drift:rand(10,65)
        });
    }
}

function makeRibbons(){
    ribbons=[];
    for(let i=0;i<9;i++){
        ribbons.push({
            angle:rand(0,TAU),
            speed:rand(.009,.025),
            radius:rand(70,Math.max(W,H)*.38),
            length:rand(100,280),
            width:rand(1.2,3),
            offset:rand(0,TAU)
        });
    }
}

function makeStars(){
    stars=[];
    for(let i=0;i<150;i++){
        stars.push({
            x:rand(0,W),
            y:rand(0,H),
            size:rand(.5,1.6),
            speed:rand(.3,1.8)
        });
    }
}

resize();

function setupAudio(){
    if(audioContext)return;

    audioContext=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioContext.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=.72;

    source=audioContext.createMediaElementSource(music);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    data=new Uint8Array(analyser.frequencyBinCount);
}

function getAudio(){
    if(!analyser||muted)return {bass:0,mid:0,high:0,volume:0};

    analyser.getByteFrequencyData(data);

    let bass=0,mid=0,high=0,all=0;

    for(let i=0;i<data.length;i++){
        const v=data[i]/255;
        all+=v;

        if(i<10)bass+=v;
        else if(i<35)mid+=v;
        else high+=v;
    }

    return {
        bass:bass/10,
        mid:mid/25,
        high:high/(data.length-35),
        volume:all/data.length
    };
}

function getPalette(seconds){
    const index=Math.min(palettes.length-1,Math.floor(seconds/40));
    return palettes[index];
}

// Bright, continuously moving color fields.
function drawColorFields(p,a){
    const shift=clock*.35;
    const size=Math.max(W,H)*.8;

    ctx.save();
    ctx.globalCompositeOperation="screen";

    for(let i=0;i<3;i++){
        const angle=shift*(i%2===0?1:-1)+i*TAU/3;
        const x=cx+Math.cos(angle)*W*.34;
        const y=cy+Math.sin(angle*1.4)*H*.3;
        const r=size*(.42+a.bass*.18);

        const g=ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,`hsla(${p.hues[i]},100%,53%,.22)`);
        g.addColorStop(.45,`hsla(${p.hues[(i+1)%3]},100%,45%,.10)`);
        g.addColorStop(1,"rgba(0,0,0,0)");

        ctx.fillStyle=g;
        ctx.fillRect(0,0,W,H);
    }

    ctx.restore();
}

// Constantly swirling spiral formations.
function drawSpirals(p,a){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalCompositeOperation="lighter";

    for(let s=0;s<5;s++){
        const hue=p.hues[s%3];

        ctx.beginPath();

        for(let i=0;i<=180;i++){
            const t=i/180;
            const angle=t*TAU*3+clock*(s%2===0?1.3:-1.1)+s*1.2;
            const radius=20+t*Math.max(W,H)*.38+
                Math.sin(t*18+clock*3+s)*12+
                a.bass*35;

            const x=Math.cos(angle)*radius;
            const y=Math.sin(angle)*radius*.65;

            if(i===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.strokeStyle=`hsla(${hue},100%,68%,.45)`;
        ctx.lineWidth=1.5+a.mid*2;
        ctx.stroke();
    }

    ctx.restore();
}

// Fast-moving colorful particles.
function drawParticles(p,a){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(const q of particles){
        q.angle+=q.speed*(1+a.bass*1.5);

        q.radius+=Math.sin(clock*2+q.wave)*.8;
        if(q.radius>Math.max(W,H)*.68)q.radius=25;

        const r=q.radius+
            Math.sin(clock*3+q.wave)*q.drift+
            a.bass*55;

        const x=cx+Math.cos(q.angle)*r;
        const y=cy+Math.sin(q.angle)*r*.72;

        const hue=(q.hue+clock*65)%360;
        const size=q.size+a.high*2;

        ctx.fillStyle=`hsla(${hue},100%,70%,.9)`;
        ctx.beginPath();
        ctx.arc(x,y,size,0,TAU);
        ctx.fill();

        // Short motion streak, no expensive blur.
        ctx.strokeStyle=`hsla(${hue},100%,65%,.4)`;
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(
            x-Math.cos(q.angle)*size*5,
            y-Math.sin(q.angle)*size*5
        );
        ctx.stroke();
    }

    ctx.restore();
}

// Fast ribbons sweeping around the entire screen.
function drawRibbons(p,a){
    ctx.save();
    ctx.globalCompositeOperation="lighter";

    for(let i=0;i<ribbons.length;i++){
        const r=ribbons[i];
        r.angle+=r.speed*(1+a.volume*1.5);

        const hue=p.hues[i%3];
        const x=cx+Math.cos(r.angle)*r.radius;
        const y=cy+Math.sin(r.angle)*r.radius*.65;

        ctx.beginPath();
        ctx.moveTo(x,y);

        ctx.bezierCurveTo(
            cx+Math.cos(r.angle+1.5)*r.length,
            cy+Math.sin(r.angle+1.5)*r.length,
            cx+Math.cos(r.angle+2.4)*r.length*1.4,
            cy+Math.sin(r.angle+2.4)*r.length*1.4,
            cx+Math.cos(r.angle+3)*r.length,
            cy+Math.sin(r.angle+3)*r.length
        );

        ctx.strokeStyle=`hsla(${hue},100%,65%,.65)`;
        ctx.lineWidth=r.width+a.bass*2;
        ctx.stroke();
    }

    ctx.restore();
}

// Big energetic waves.
function drawWaves(p,a){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalCompositeOperation="lighter";

    for(let ring=0;ring<7;ring++){
        const radius=40+ring*55+
            Math.sin(clock*3+ring)*18+
            a.bass*90;

        const hue=p.hues[ring%3];

        ctx.beginPath();

        for(let i=0;i<=120;i++){
            const angle=i/120*TAU;
            const distortion=
                Math.sin(angle*6+clock*4+ring)*18+
                Math.sin(angle*11-clock*3)*10+
                a.mid*25;

            const rr=radius+distortion;
            const x=Math.cos(angle+clock*.35)*rr;
            const y=Math.sin(angle+clock*.35)*rr*.8;

            if(i===0)ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.closePath();
        ctx.strokeStyle=`hsla(${hue},100%,70%,.55)`;
        ctx.lineWidth=1.5+a.bass*2;
        ctx.stroke();
    }

    ctx.restore();
}

// Constantly shifting center burst.
function drawCenter(p,a){
    const pulse=1+a.bass*2+Math.sin(clock*5)*.25;
    const radius=35*pulse;

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*5);
    g.addColorStop(0,`hsla(${p.hues[0]},100%,90%,.85)`);
    g.addColorStop(.25,`hsla(${p.hues[1]},100%,65%,.4)`);
    g.addColorStop(.6,`hsla(${p.hues[2]},100%,55%,.12)`);
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=g;
    ctx.fillRect(cx-radius*5,cy-radius*5,radius*10,radius*10);
    ctx.restore();
}

function drawStarfield(){
    ctx.save();
    ctx.globalAlpha=.65;

    for(const s of stars){
        s.x+=Math.cos(clock+s.y)*s.speed;
        s.y+=Math.sin(clock*.7+s.x)*s.speed;

        if(s.x<0)s.x=W;
        if(s.x>W)s.x=0;
        if(s.y<0)s.y=H;
        if(s.y>H)s.y=0;

        ctx.fillStyle="#ffffff";
        ctx.fillRect(s.x,s.y,s.size,s.size);
    }

    ctx.restore();
}

function draw(timestamp){
    requestAnimationFrame(draw);

    if(!started||paused)return;
    if(timestamp-lastFrame<FRAME)return;

    const delta=lastFrame?Math.min((timestamp-lastFrame)/16.67,2):1;
    lastFrame=timestamp;

    clock+=.045*delta;

    const seconds=music.currentTime||0;
    const palette=getPalette(seconds);
    const audio=getAudio();

    // Solid background: no costly full-screen blur.
    ctx.fillStyle="#03000b";
    ctx.fillRect(0,0,W,H);

    drawColorFields(palette,audio);
    drawStarfield();
    drawSpirals(palette,audio);
    drawWaves(palette,audio);
    drawRibbons(palette,audio);
    drawParticles(palette,audio);
    drawCenter(palette,audio);

    document.getElementById("phase").textContent=palette.name;

    const time=Math.floor(seconds);
    document.getElementById("time").textContent=
        `${String(Math.floor(time/60)).padStart(2,"0")}:${String(time%60).padStart(2,"0")}`;

    if(music.duration&&Number.isFinite(music.duration)){
        document.getElementById("progressFill").style.width=
            `${seconds/music.duration*100}%`;
    }
}

async function begin(){
    if(started)return;

    setupAudio();

    try{
        await audioContext.resume();
        await music.play();
    }catch(e){
        console.error(e);
        alert("Couldn't play the music. Check your MP3 file in assets.");
        return;
    }

    started=true;
    intro.style.opacity="0";
    setTimeout(()=>intro.style.display="none",1500);
    document.getElementById("hud").classList.add("visible");
    requestAnimationFrame(draw);
}

document.getElementById("startButton").onclick=begin;

document.getElementById("pauseButton").onclick=async()=>{
    if(!started)return;

    if(paused){
        await music.play();
        paused=false;
        document.getElementById("pauseButton").textContent="Ⅱ";
        requestAnimationFrame(draw);
    }else{
        music.pause();
        paused=true;
        document.getElementById("pauseButton").textContent="▶";
    }
};

document.getElementById("muteButton").onclick=()=>{
    muted=!muted;
    music.muted=muted;
    document.getElementById("muteButton").textContent=muted?"×":"♪";
};

document.getElementById("restartButton").onclick=async()=>{
    if(!started)return;

    music.currentTime=0;

    if(paused){
        await music.play();
        paused=false;
        document.getElementById("pauseButton").textContent="Ⅱ";
        requestAnimationFrame(draw);
    }
};

music.addEventListener("ended",()=>{
    paused=true;
    document.getElementById("pauseButton").textContent="▶";
});
</script>

</body>
</html>
